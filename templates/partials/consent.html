{{define "consent" -}}
{{- if .Site.Tag.IsSet}}
<!-- Consent bootstrap — the single source of truth for consent configuration,
     inlined and synchronous so it always runs BEFORE whichever tag was resolved:
     before gtag/js on the GA4 branch, before the container script on the GTM
     branch. Consent Mode v2 starts fully denied; a stored, still-valid "granted"
     choice is replayed here so returning visitors aren't re-prompted.

     The default-denied block is deliberately OUTSIDE both tag branches. Living
     inside the GTM-only path would ship the GA4 path with no consent gating at
     all — the exact failure this block exists to prevent.

     Which snippet renders is decided by site.Tag.Kind, resolved once at boot.
     Nothing here inspects the id, so a GA4 id can never be served as a
     container (which would silently collect nothing). Exactly one path emits. -->
<script>
(function (w) {
  'use strict';
  var CONFIG = {
    storageKey: 'cookie-consent',
    version: {{.Site.ConsentVersion}},
    maxAgeMs: {{.Site.ConsentMaxAgeDays}} * 24 * 60 * 60 * 1000
  };
  w.CONSENT_CONFIG = CONFIG;

  // The resolved tag, handed to the client so track() branches on the same
  // value the server used. No prefix-matching in JS, no second source of truth.
  w.__tag = { kind: {{.Site.Tag.JSKind}} };

  w.dataLayer = w.dataLayer || [];
  function gtag() { w.dataLayer.push(arguments); }
  w.gtag = gtag;

  gtag('consent', 'default', {
    'analytics_storage': 'denied',
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied'
  });

  try {
    var raw = w.localStorage.getItem(CONFIG.storageKey);
    if (raw) {
      var c = JSON.parse(raw);
      if (c && c.version === CONFIG.version && c.status === 'granted' &&
          typeof c.timestamp === 'number' && (Date.now() - c.timestamp) < CONFIG.maxAgeMs) {
        gtag('consent', 'update', { 'analytics_storage': 'granted' });
      }
    }
  } catch (e) { /* storage blocked → stay denied (the safe default) */ }
{{- if .Site.Tag.IsGA4}}

  // GA4 direct: gtag.js needs the js/config pair. On the GTM branch this must
  // NOT run — GA4 is configured inside the container there, and doing both
  // double-counts every pageview.
  gtag('js', new Date());
  gtag('config', {{.Site.Tag.ID}});
{{- end}}
})(window);
</script>
{{- if .Site.Tag.IsGA4}}
<script async src="https://www.googletagmanager.com/gtag/js?id={{.Site.Tag.ID}}"></script>
{{- end}}
{{- if .Site.Tag.IsGTM}}
<script>
(function (w, d, s, l, i) {
  w[l] = w[l] || [];
  w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
  var f = d.getElementsByTagName(s)[0], j = d.createElement(s),
      dl = l != 'dataLayer' ? '&l=' + l : '';
  j.async = true;
  j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
  f.parentNode.insertBefore(j, f);
})(window, document, 'script', 'dataLayer', {{.Site.Tag.ID}});
</script>
{{- end}}
{{- end}}
{{- end}}

{{/* The <noscript> iframe is GTM-only: it does nothing for gtag.js, so it must
     never be copied over to the GA4 branch. */}}
{{define "gtm-noscript" -}}
{{- if .Site.Tag.IsGTM}}
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{.Site.Tag.ID}}"
    height="0" width="0" style="display:none;visibility:hidden" title="Google Tag Manager"></iframe></noscript>
{{- end}}
{{- end}}
