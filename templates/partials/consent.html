{{define "consent" -}}
{{- if .Site.NeedsConsent}}
<!-- Consent bootstrap — the single source of truth for consent configuration,
     inlined and synchronous so it always runs BEFORE gtag/js and GTM. Consent
     Mode v2 starts fully denied; a stored, still-valid "granted" choice is
     replayed here so returning visitors aren't re-prompted. consent.js reads the
     same window.CONSENT_CONFIG, so the key/version/max-age live in one place. -->
<script>
(function (w) {
  'use strict';
  var CONFIG = {
    storageKey: 'cookie-consent',
    version: {{.Site.ConsentVersion}},
    maxAgeMs: {{.Site.ConsentMaxAgeDays}} * 24 * 60 * 60 * 1000,
    gaId: {{.Site.GAID}}
  };
  w.CONSENT_CONFIG = CONFIG;

  w.dataLayer = w.dataLayer || [];
  function gtag() { w.dataLayer.push(arguments); }
  w.gtag = gtag;

  gtag('consent', 'default', {
    'analytics_storage': 'denied',
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied'
  });

  try {
    var raw = w.localStorage.getItem(CONFIG.storageKey);
    if (raw) {
      var c = JSON.parse(raw);
      if (c && c.version === CONFIG.version && c.status === 'granted' &&
          typeof c.timestamp === 'number' && (Date.now() - c.timestamp) < CONFIG.maxAgeMs) {
        gtag('consent', 'update', { 'analytics_storage': 'granted' });
      }
    }
  } catch (e) { /* storage blocked → stay denied (the safe default) */ }

  gtag('js', new Date());
  if (CONFIG.gaId) { gtag('config', CONFIG.gaId); }
})(window);
</script>
{{- if .Site.GAID}}
<script async src="https://www.googletagmanager.com/gtag/js?id={{.Site.GAID}}"></script>
{{- end}}
{{- if .Site.GTMID}}
<script>
(function (w, d, s, l, i) {
  w[l] = w[l] || [];
  w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
  var f = d.getElementsByTagName(s)[0], j = d.createElement(s),
      dl = l != 'dataLayer' ? '&l=' + l : '';
  j.async = true;
  j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
  f.parentNode.insertBefore(j, f);
})(window, document, 'script', 'dataLayer', {{.Site.GTMID}});
</script>
{{- end}}
{{- end}}
{{- end}}

{{define "gtm-noscript" -}}
{{- if .Site.GTMID}}
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{.Site.GTMID}}"
    height="0" width="0" style="display:none;visibility:hidden" title="Google Tag Manager"></iframe></noscript>
{{- end}}
{{- end}}
